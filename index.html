<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache">
<title>商机筛选助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC",-apple-system,sans-serif;background:#0b1120;color:#d0d8e8;min-height:100vh;-webkit-text-size-adjust:100%}
.hdr{padding:16px 16px 12px;border-bottom:1px solid rgba(77,216,255,0.08)}
.hdr h1{font-size:18px;color:#fff;font-weight:800}
.hdr h1 em{font-style:normal;color:#4dd8ff}
.hdr .sub{font-size:11px;color:#5a6a88;margin-top:2px}
.main-tabs{display:flex;gap:0;border-bottom:1px solid rgba(77,216,255,0.08);padding:0 16px}
.main-tab{padding:10px 18px;font-size:13px;cursor:pointer;background:transparent;color:#5a6a88;border:none;border-bottom:2px solid transparent;font-weight:500}
.main-tab:hover{color:#8a9ab0}
.main-tab.active{color:#4dd8ff;border-bottom-color:#4dd8ff;font-weight:600}
.tab-content{display:none;padding:12px 16px 80px}
.tab-content.active{display:block}
.kpi-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.kpi-card{background:#111b2e;border:1px solid rgba(77,216,255,0.06);border-radius:10px;padding:10px 14px;min-width:70px;flex-shrink:0}
.kpi-v{font-size:18px;font-weight:800;color:#fff}
.kpi-l{font-size:10px;color:#5a6a88;margin-top:2px}
.kpi-card.green .kpi-v{color:#66ffaa}
.kpi-card.orange .kpi-v{color:#ffaa44}
.kpi-card.red .kpi-v{color:#ff6b6b}
.empty-msg{text-align:center;padding:40px 20px;color:#5a6a88;font-size:13px}

/* Heatmap */
.hm-legend{display:flex;gap:10px;padding:6px 0;font-size:11px;color:#5a6a88;flex-wrap:wrap;margin-bottom:8px}
.hm-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:middle}

/* Filter bar - input + autocomplete for both city and category */
.hm-fbar{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.hm-fbox{flex:1;min-width:160px;position:relative}
.hm-fbox-label{font-size:11px;color:#5a6a88;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.hm-fbox-label .act{font-size:10px;color:#4dd8ff;cursor:pointer;padding:1px 6px;border:1px solid rgba(77,216,255,0.2);border-radius:3px;background:transparent}
.hm-fbox-label .act:hover{background:rgba(77,216,255,0.08)}
.hm-finput{width:100%;padding:7px 10px;border:1px solid rgba(77,216,255,0.15);border-radius:6px;background:rgba(255,255,255,0.03);color:#d0d8e8;font-size:12px;outline:none}
.hm-finput:focus{border-color:#4dd8ff}
.hm-suggest{position:absolute;top:100%;left:0;right:0;z-index:50;background:#151f30;border:1px solid rgba(77,216,255,0.2);border-radius:6px;margin-top:2px;max-height:180px;overflow-y:auto;display:none;box-shadow:0 6px 18px rgba(0,0,0,0.4)}
.hm-suggest.show{display:block}
.hm-suggest::-webkit-scrollbar{width:4px}
.hm-suggest::-webkit-scrollbar-thumb{background:rgba(77,216,255,0.15);border-radius:2px}
.hm-sug-item{padding:6px 10px;font-size:12px;color:#8a9ab0;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.03)}
.hm-sug-item:hover{background:rgba(77,216,255,0.08);color:#d0d8e8}
.hm-sug-item.last{border:none}
.hm-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.hm-tag{padding:3px 8px;background:rgba(77,216,255,0.1);border:1px solid rgba(77,216,255,0.2);border-radius:5px;font-size:11px;color:#4dd8ff;display:flex;align-items:center;gap:4px}
.hm-tag .tx{cursor:pointer;font-size:9px;opacity:0.6;font-weight:700}
.hm-tag .tx:hover{opacity:1}

.hm-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.hm{border-collapse:separate;border-spacing:1px;font-size:11px;width:100%}
table.hm th{position:sticky;top:0;z-index:10;background:#0e1728;padding:5px 3px;font-weight:600;color:#5a7a9a;font-size:10px;white-space:nowrap;text-align:center}
table.hm th.hc{position:sticky;left:0;z-index:20;text-align:left;padding:6px 10px;color:#8a9ab0;writing-mode:horizontal-tb;min-width:80px}
table.hm td{padding:4px 3px;text-align:center;border-radius:2px;height:22px;font-size:10px;min-width:28px}
table.hm td.cc{position:sticky;left:0;z-index:5;background:#111b2e;text-align:left;padding:5px 10px;font-weight:500;white-space:nowrap;color:#8a9ab0;font-size:11px}
table.hm td.av{background:rgba(102,255,170,0.05);cursor:pointer}
table.hm td.av:hover{background:rgba(102,255,170,0.18);box-shadow:inset 0 0 0 1px rgba(102,255,170,0.3)}
table.hm td.fr{background:rgba(102,255,170,0.12);color:#66ffaa;font-weight:700}
table.hm td.so{background:rgba(255,170,68,0.2);color:#ffc844;font-weight:700}
table.hm td.md{background:rgba(255,107,107,0.12);color:#aa6666}
table.hm td.fa{background:rgba(255,80,80,0.05);color:#553838}
table.hm td.sa{color:#66ffaa;font-weight:700;text-align:center;padding:4px 6px}
table.hm td.sr{color:#ffaa44;font-weight:700;text-align:center;padding:4px 6px}
.rsep td{padding:0!important;border:none!important}
.rsep .rl{font-size:10px;color:#4dd8ff;font-weight:700;padding:10px 10px 4px;letter-spacing:2px;background:#111b2e}
.loading{text-align:center;padding:60px 20px;color:#5a6a88;font-size:13px}

/* Biz context card */
.biz-context-card{background:#111b2e;border:1px solid rgba(77,216,255,0.12);border-radius:12px;padding:20px;margin-top:8px}
.biz-ctx-header{font-size:15px;font-weight:700;color:#4dd8ff;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.biz-ctx-icon{font-size:18px}
.biz-ctx-info{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.biz-ctx-item{background:rgba(77,216,255,0.06);border:1px solid rgba(77,216,255,0.1);border-radius:8px;padding:10px 16px;min-width:100px}
.biz-ctx-label{display:block;font-size:10px;color:#5a6a88;margin-bottom:4px}
.biz-ctx-value{display:block;font-size:16px;font-weight:700;color:#e0e6f0}
.biz-ctx-placeholder{text-align:center;padding:20px;color:#5a6a88;font-size:12px;border-top:1px solid rgba(77,216,255,0.06)}
</style></head><body>

<div class="hdr">
  <h1>商机 <em>筛选助手</em></h1>
  <div class="sub">商机明细 + 顶展抢占地图 + 钻展抢占地图</div>
</div>

<div class="main-tabs">
  <button class="main-tab active" onclick="switchTab('biz',this)">商机明细</button>
  <button class="main-tab" onclick="switchTab('heatmap',this)">顶展抢占地图</button>
  <button class="main-tab" onclick="switchTab('zuanzhan',this)">钻展抢占地图</button>
</div>

<!-- Biz tab -->
<div id="tabBiz" class="tab-content active">
  <div id="bizList">
    <div class="empty-msg" style="text-align:center;padding:60px 20px;color:#5a6a88">
      <div style="font-size:36px;margin-bottom:12px">📋</div>
      <div style="font-size:14px;color:#8a9ab0;margin-bottom:8px">商机明细数据待更新</div>
      <div style="font-size:12px">从顶展/钻展抢占地图的空白格点击，可跳转到对应城市+类目查看商机</div>
    </div>
  </div>
</div>

<!-- Heatmap tab -->
<div id="tabHeatmap" class="tab-content">
  <div class="hm-legend">
    <span><i style="background:rgba(102,255,170,0.08)"></i>空白可抢</span>
    <span><i style="background:rgba(102,255,170,0.15)"></i>已释放</span>
    <span><i style="background:rgba(255,170,68,0.25)"></i>30天内</span>
    <span><i style="background:rgba(255,107,107,0.15)"></i>30-90天</span>
    <span><i style="background:rgba(255,80,80,0.06)"></i>90天+</span>
  </div>
  <div id="hmFilter"></div>
  <div class="kpi-row" id="hmKpis"></div>
  <div class="hm-wrap" id="hmWrap"><div class="loading">点击"顶展抢占地图"加载数据...</div></div>
</div>

<!-- Zuanzhan tab -->
<div id="tabZuanzhan" class="tab-content">
  <div class="hm-legend">
    <span style="color:#f0a030;font-weight:600;margin-right:8px">高频&钻展v1</span>
    <span><i style="background:rgba(102,255,170,0.08)"></i>空白可抢</span>
    <span><i style="background:rgba(102,255,170,0.15)"></i>已释放</span>
    <span><i style="background:rgba(255,170,68,0.25)"></i>30天内</span>
    <span><i style="background:rgba(255,107,107,0.15)"></i>30-90天</span>
    <span><i style="background:rgba(255,80,80,0.06)"></i>90天+</span>
  </div>
  <div id="zzFilter"></div>
  <div class="kpi-row" id="zzKpis"></div>
  <div class="hm-wrap" id="zzWrap"><div class="loading">点击"钻展抢占地图"加载数据...</div></div>
</div>

<script>
var HM=null,ZZ=null;
var HM_SEL=new Set(),HM_CSEL=new Set();
var ZZ_SEL=new Set(),ZZ_CSEL=new Set();
var BIZ={city:'',cat:''};

function switchTab(tab,el){
  document.querySelectorAll('.main-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  document.getElementById('tabBiz').classList.toggle('active',tab==='biz');
  document.getElementById('tabHeatmap').classList.toggle('active',tab==='heatmap');
  document.getElementById('tabZuanzhan').classList.toggle('active',tab==='zuanzhan');
  closeSuggest();
  if(tab==='heatmap'&&!HM){
    document.getElementById('hmWrap').innerHTML='<div class="loading">加载中...</div>';
    fetch('data/heatmap.json').then(function(r){return r.json()}).then(function(d){HM=d;initHM()});
  }
  if(tab==='zuanzhan'&&!ZZ){
    document.getElementById('zzWrap').innerHTML='<div class="loading">加载中...</div>';
    fetch('data/zuanzhan-heatmap.json').then(function(r){return r.json()}).then(function(d){ZZ=d;initZZ()});
  }
}

document.addEventListener('click',function(e){if(!e.target.closest('.hm-fbox'))closeSuggest()});
function closeSuggest(){document.querySelectorAll('.hm-suggest').forEach(function(s){s.classList.remove('show')})}

// === Biz ===
function jumpToBiz(cityName,catLabel,product){
  BIZ.city=cityName;BIZ.cat=catLabel;
  document.querySelectorAll('.main-tab').forEach(function(t){t.classList.remove('active')});
  document.querySelectorAll('.main-tab')[0].classList.add('active');
  document.getElementById('tabBiz').classList.add('active');
  document.getElementById('tabHeatmap').classList.remove('active');
  document.getElementById('tabZuanzhan').classList.remove('active');
  renderBizContext(product);window.scrollTo(0,0);
}
function renderBizContext(product){
  var h='<div class="biz-context-card"><div class="biz-ctx-header"><span class="biz-ctx-icon">📍</span>来自'+product+'抢占地图</div>';
  h+='<div class="biz-ctx-info">';
  h+='<div class="biz-ctx-item"><span class="biz-ctx-label">城市</span><span class="biz-ctx-value">'+esc(BIZ.city)+'</span></div>';
  h+='<div class="biz-ctx-item"><span class="biz-ctx-label">类目</span><span class="biz-ctx-value">'+esc(BIZ.cat)+'</span></div>';
  h+='<div class="biz-ctx-item"><span class="biz-ctx-label">状态</span><span class="biz-ctx-value" style="color:#66ffaa">空白可抢</span></div>';
  h+='</div><div class="biz-ctx-placeholder">商机明细数据待更新，届时将展示该城市+类目下的具体商户商机</div></div>';
  document.getElementById('bizList').innerHTML=h;
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// === Init ===
function initHM(){
  HM_SEL=new Set(HM.cities.map(function(c){return c.city}));
  HM_CSEL=new Set(HM.cats.map(function(c){return c.id}));
  renderFilter('hm',HM,'顶展');renderMatrix('hm',HM,'顶展');
}
function initZZ(){
  ZZ_SEL=new Set(ZZ.cities.map(function(c){return c.city}));
  ZZ_CSEL=new Set(ZZ.cats.map(function(c){return c.id}));
  renderFilter('zz',ZZ,'钻展');renderMatrix('zz',ZZ,'钻展');
}

// === Filter UI: both city and category are input + autocomplete ===
function renderFilter(prefix,data,product){
  var sel=prefix==='hm'?HM_SEL:ZZ_SEL;
  var csel=prefix==='hm'?HM_CSEL:ZZ_CSEL;
  var el=document.getElementById(prefix+'Filter');
  var h='<div class="hm-fbar">';
  // City input
  h+='<div class="hm-fbox">';
  h+='<div class="hm-fbox-label">城市 <button class="act" onclick="addAll(\''+prefix+'\',\'city\')">全选</button><button class="act" onclick="clearAll(\''+prefix+'\',\'city\')">清空</button></div>';
  h+='<input class="hm-finput" id="cityInput-'+prefix+'" placeholder="输入城市名..." oninput="onInput(\''+prefix+'\',\'city\')" onfocus="onInput(\''+prefix+'\',\'city\')">';
  h+='<div class="hm-suggest" id="citySug-'+prefix+'"></div>';
  if(sel.size>0){
    h+='<div class="hm-tags">';
    data.cities.forEach(function(c){if(sel.has(c.city))h+='<span class="hm-tag">'+esc(c.city)+'<span class="tx" onclick="removeItem(\''+prefix+'\',\'city\',\''+c.city.replace(/'/g,"\\'")+'\')">✕</span></span>'});
    h+='</div>';
  }
  h+='</div>';
  // Category input
  h+='<div class="hm-fbox">';
  h+='<div class="hm-fbox-label">类目 <button class="act" onclick="addAll(\''+prefix+'\',\'cat\')">全选</button><button class="act" onclick="clearAll(\''+prefix+'\',\'cat\')">清空</button></div>';
  h+='<input class="hm-finput" id="catInput-'+prefix+'" placeholder="输入类目名..." oninput="onInput(\''+prefix+'\',\'cat\')" onfocus="onInput(\''+prefix+'\',\'cat\')">';
  h+='<div class="hm-suggest" id="catSug-'+prefix+'"></div>';
  if(csel.size>0){
    h+='<div class="hm-tags">';
    data.cats.forEach(function(c){if(csel.has(c.id))h+='<span class="hm-tag">'+esc(c.label)+'<span class="tx" onclick="removeItem(\''+prefix+'\',\'cat\',\''+c.id+'\')">✕</span></span>'});
    h+='</div>';
  }
  h+='</div>';
  h+='</div>';
  el.innerHTML=h;
}

function onInput(prefix,type){
  var inputId=type==='city'?'cityInput-'+prefix:'catInput-'+prefix;
  var sugId=type==='city'?'citySug-'+prefix:'catSug-'+prefix;
  var input=document.getElementById(inputId);
  var sug=document.getElementById(sugId);
  var q=(input.value||'').trim().toLowerCase();
  if(!q){sug.classList.remove('show');return}
  var data=prefix==='hm'?HM:ZZ;
  var items,selected;
  if(type==='city'){
    selected=prefix==='hm'?HM_SEL:ZZ_SEL;
    items=data.cities.filter(function(c){return c.city.toLowerCase().indexOf(q)>=0&&!selected.has(c.city)}).slice(0,20);
  }else{
    selected=prefix==='hm'?HM_CSEL:ZZ_CSEL;
    items=data.cats.filter(function(c){return c.label.toLowerCase().indexOf(q)>=0&&!selected.has(c.id)}).slice(0,20);
  }
  if(!items.length){sug.classList.remove('show');return}
  var h='';
  items.forEach(function(c,i){
    var name=type==='city'?c.city:c.label;
    var val=type==='city'?c.city.replace(/'/g,"\\'"):c.id;
    h+='<div class="hm-sug-item'+(i===items.length-1?' last':'')+'" onclick="addItem(\''+prefix+'\',\''+type+'\',\''+val.replace(/'/g,"\\'")+'\')">'+esc(name)+'</div>';
  });
  sug.innerHTML=h;sug.classList.add('show');
}

function addItem(prefix,type,val){
  if(type==='city'){
    (prefix==='hm'?HM_SEL:ZZ_SEL).add(val);
  }else{
    (prefix==='hm'?HM_CSEL:ZZ_CSEL).add(val);
  }
  var data=prefix==='hm'?HM:ZZ;var p=prefix==='hm'?'顶展':'钻展';
  renderFilter(prefix,data,p);renderMatrix(prefix,data,p);
  var inputId=type==='city'?'cityInput-'+prefix:'catInput-'+prefix;
  var input=document.getElementById(inputId);if(input)input.value='';
  var sugId=type==='city'?'citySug-'+prefix:'catSug-'+prefix;
  var sug=document.getElementById(sugId);if(sug)sug.classList.remove('show');
}
function removeItem(prefix,type,val){
  if(type==='city'){
    (prefix==='hm'?HM_SEL:ZZ_SEL).delete(val);
  }else{
    (prefix==='hm'?HM_CSEL:ZZ_CSEL).delete(val);
  }
  var data=prefix==='hm'?HM:ZZ;var p=prefix==='hm'?'顶展':'钻展';
  renderFilter(prefix,data,p);renderMatrix(prefix,data,p);
}
function addAll(prefix,type){
  var data=prefix==='hm'?HM:ZZ;
  if(type==='city'){
    var sel=prefix==='hm'?HM_SEL:ZZ_SEL;
    data.cities.forEach(function(c){sel.add(c.city)});
  }else{
    var sel=prefix==='hm'?HM_CSEL:ZZ_CSEL;
    data.cats.forEach(function(c){sel.add(c.id)});
  }
  var p=prefix==='hm'?'顶展':'钻展';
  renderFilter(prefix,data,p);renderMatrix(prefix,data,p);
}
function clearAll(prefix,type){
  if(type==='city')(prefix==='hm'?HM_SEL:ZZ_SEL).clear();
  else(prefix==='hm'?HM_CSEL:ZZ_CSEL).clear();
  var data=prefix==='hm'?HM:ZZ;var p=prefix==='hm'?'顶展':'钻展';
  renderFilter(prefix,data,p);renderMatrix(prefix,data,p);
}

// === Matrix rendering ===
function renderMatrix(prefix,data,product){
  var sel=prefix==='hm'?HM_SEL:ZZ_SEL;
  var csel=prefix==='hm'?HM_CSEL:ZZ_CSEL;
  var wrapId=prefix==='hm'?'hmWrap':'zzWrap';
  var kpiId=prefix==='hm'?'hmKpis':'zzKpis';
  var cities=data.cities.filter(function(c){return sel.has(c.city)});
  var cats=data.cats.filter(function(c){return csel.has(c.id)});
  if(!cities.length||!cats.length){
    document.getElementById(kpiId).innerHTML='';
    document.getElementById(wrapId).innerHTML='<div class="empty-msg">请输入城市和类目进行筛选</div>';
    return;
  }
  var tA=0,tR=0;
  cities.forEach(function(c){cats.forEach(function(cat){if(!c.occ[cat.id])tA++;else if(c.occ[cat.id].d>=0&&c.occ[cat.id].d<=30)tR++})});
  document.getElementById(kpiId).innerHTML=
    '<div class="kpi-card"><div class="kpi-v">'+cities.length+'</div><div class="kpi-l">城市</div></div>'+
    '<div class="kpi-card green"><div class="kpi-v">'+tA+'</div><div class="kpi-l">空白槽位</div></div>'+
    '<div class="kpi-card orange"><div class="kpi-v">'+tR+'</div><div class="kpi-l">30天内释放</div></div>'+
    '<div class="kpi-card"><div class="kpi-v">'+cats.length+'</div><div class="kpi-l">类目</div></div>';
  var regionOrder={'华北':0,'华东':1,'华中':2,'华南':3,'华西':4};
  var sorted=cities.slice().sort(function(a,b){return(regionOrder[a.region]||99)-(regionOrder[b.region]||99)});
  var h='<table class="hm"><thead><tr><th class="hc">城市</th>';
  cats.forEach(function(c){h+='<th title="'+c.label+'">'+c.label+'</th>'});
  h+='<th style="color:#66ffaa">可抢</th><th style="color:#ffaa44">30天</th></tr></thead><tbody>';
  var lr='';
  sorted.forEach(function(city){
    if(city.region!==lr){h+='<tr class="rsep"><td class="rl" colspan="'+(cats.length+3)+'">▎'+city.region+'</td></tr>';lr=city.region}
    var avail=0,rel30=0;
    h+='<tr><td class="cc">'+city.city+'</td>';
    cats.forEach(function(cat){
      var occ=city.occ[cat.id];
      if(!occ){avail++;h+='<td class="av" onclick="jumpToBiz(\''+city.city.replace(/'/g,"\\'")+'\',\''+cat.label+'\',\''+product+'\')" title="'+city.city+'·'+cat.label+'" style="cursor:pointer;color:#66ffaa44">+</td>'}
      else if(occ.d<0){avail++;h+='<td class="fr" onclick="jumpToBiz(\''+city.city.replace(/'/g,"\\'")+'\',\''+cat.label+'\',\''+product+'\')" title="已释放" style="cursor:pointer">✓</td>'}
      else if(occ.d<=30){rel30++;h+='<td class="so" onclick="jumpToBiz(\''+city.city.replace(/'/g,"\\'")+'\',\''+cat.label+'\',\''+product+'\')" title="'+occ.ds+'释放" style="cursor:pointer">'+occ.ds+'</td>'}
      else if(occ.d<=90)h+='<td class="md" title="'+occ.ds+'">'+occ.ds+'</td>';
      else h+='<td class="fa" title="'+occ.ds+'">'+occ.ds+'</td>';
    });
    h+='<td class="sa">'+avail+'</td><td class="sr">'+(rel30>0?rel30:'-')+'</td></tr>';
  });
  h+='</tbody></table>';
  document.getElementById(wrapId).innerHTML=h;
}
</script>
</body></html>
