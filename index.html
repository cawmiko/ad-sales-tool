<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache">
<title>商机筛选助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC",-apple-system,sans-serif;background:#0b1120;color:#d0d8e8;min-height:100vh;-webkit-text-size-adjust:100%}

/* Header */
.hdr{padding:16px 16px 12px;border-bottom:1px solid rgba(77,216,255,0.08)}
.hdr h1{font-size:18px;color:#fff;font-weight:800}
.hdr h1 em{font-style:normal;color:#4dd8ff}
.hdr .sub{font-size:11px;color:#5a6a88;margin-top:2px}

/* Main tabs */
.main-tabs{display:flex;gap:0;border-bottom:1px solid rgba(77,216,255,0.08);padding:0 16px}
.main-tab{padding:10px 18px;font-size:13px;cursor:pointer;background:transparent;color:#5a6a88;border:none;border-bottom:2px solid transparent;font-weight:500}
.main-tab:hover{color:#8a9ab0}
.main-tab.active{color:#4dd8ff;border-bottom-color:#4dd8ff;font-weight:600}
.tab-content{display:none;padding:12px 16px 80px}
.tab-content.active{display:block}

/* KPIs */
.kpi-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.kpi-card{background:#111b2e;border:1px solid rgba(77,216,255,0.06);border-radius:10px;padding:10px 14px;min-width:70px;flex-shrink:0}
.kpi-v{font-size:18px;font-weight:800;color:#fff}
.kpi-l{font-size:10px;color:#5a6a88;margin-top:2px}
.kpi-card.green .kpi-v{color:#66ffaa}
.kpi-card.orange .kpi-v{color:#ffaa44}
.kpi-card.red .kpi-v{color:#ff6b6b}

/* Filters */
.filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter-sel{padding:6px 10px;border:1px solid rgba(77,216,255,0.15);border-radius:8px;background:rgba(255,255,255,0.03);color:#8a9ab0;font-size:12px;outline:none;min-width:80px}
.search-input{flex:1;min-width:100px;padding:6px 10px;border:1px solid rgba(77,216,255,0.15);border-radius:8px;background:rgba(255,255,255,0.03);color:#d0d8e8;font-size:12px;outline:none}
.filter-sel:focus,.search-input:focus{border-color:#4dd8ff}

/* Sort */
.sort-row{display:flex;gap:4px;margin-bottom:10px}
.sort-btn{padding:5px 10px;border:1px solid rgba(77,216,255,0.1);border-radius:6px;background:transparent;color:#5a6a88;font-size:11px;cursor:pointer}
.sort-btn.active{background:rgba(77,216,255,0.1);color:#4dd8ff;border-color:rgba(77,216,255,0.3)}

/* Store cards */
.store-card{background:#111b2e;border:1px solid rgba(77,216,255,0.06);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.store-card.p0{border-left:3px solid #ff6b6b}
.store-card.p1{border-left:3px solid #ffaa44}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.sc-name{font-size:14px;font-weight:600;color:#e0e6f0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-score{font-size:15px;font-weight:800;padding:2px 8px;border-radius:6px;flex-shrink:0;margin-left:8px}
.sc-score.p0{background:rgba(255,107,107,0.15);color:#ff6b6b}
.sc-score.p1{background:rgba(255,170,68,0.15);color:#ffaa44}
.sc-score.p2{background:rgba(77,216,255,0.08);color:#5a8aaa}
.sc-meta{display:flex;gap:6px;font-size:11px;color:#5a6a88;margin-bottom:6px;flex-wrap:wrap}
.sc-tags{display:flex;gap:4px;flex-wrap:wrap}
.sc-tag{padding:2px 7px;border-radius:6px;font-size:10px;font-weight:600}
.tag-l1{background:rgba(77,216,255,0.1);color:#4dd8ff}
.tag-trade{background:rgba(255,107,107,0.12);color:#ff6b6b}
.tag-adv{background:rgba(255,170,68,0.12);color:#ffaa44}
.tag-potential{background:rgba(102,255,170,0.1);color:#66ffaa}
.sc-nums{display:flex;gap:12px;font-size:11px;color:#5a6a88;margin-top:6px}
.sc-nums .nv{color:#c8d0e0;font-weight:600}
.count-bar{font-size:11px;color:#5a6a88;margin-bottom:8px}
.empty-msg{text-align:center;padding:40px 20px;color:#5a6a88;font-size:13px}

/* Heatmap */
.hm-legend{display:flex;gap:10px;padding:6px 0;font-size:11px;color:#5a6a88;flex-wrap:wrap;margin-bottom:8px}
.hm-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:middle}
.hm-rtabs{display:flex;gap:0;margin-bottom:10px;overflow-x:auto;border-bottom:1px solid rgba(77,216,255,0.06)}
.hm-rtab{padding:8px 14px;font-size:12px;cursor:pointer;background:transparent;color:#5a6a88;border:none;border-bottom:2px solid transparent;white-space:nowrap}
.hm-rtab:hover{color:#8a9ab0}
.hm-rtab.active{color:#4dd8ff;border-bottom-color:#4dd8ff}
.hm-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.hm{border-collapse:separate;border-spacing:1px;font-size:11px;width:100%}
table.hm th{position:sticky;top:0;z-index:10;background:#0e1728;padding:5px 3px;font-weight:600;color:#5a7a9a;font-size:10px;white-space:nowrap;text-align:center}
table.hm th.hc{position:sticky;left:0;z-index:20;text-align:left;padding:6px 10px;color:#8a9ab0;writing-mode:horizontal-tb;min-width:80px}
table.hm th.gs{width:1px;background:rgba(77,216,255,0.1);padding:0}
table.hm td{padding:4px 3px;text-align:center;border-radius:2px;height:22px;font-size:10px;min-width:28px}
table.hm td.cc{position:sticky;left:0;z-index:5;background:#111b2e;text-align:left;padding:5px 10px;font-weight:500;white-space:nowrap;color:#8a9ab0;font-size:11px}
table.hm td.av{background:rgba(102,255,170,0.05);cursor:pointer}
table.hm td.av:hover{background:rgba(102,255,170,0.18);box-shadow:inset 0 0 0 1px rgba(102,255,170,0.3)}
table.hm td.fr{background:rgba(102,255,170,0.12);color:#66ffaa;font-weight:700}
table.hm td.so{background:rgba(255,170,68,0.2);color:#ffc844;font-weight:700}
table.hm td.md{background:rgba(255,107,107,0.12);color:#aa6666}
table.hm td.fa{background:rgba(255,80,80,0.05);color:#553838}
table.hm td.gs{width:1px;background:rgba(77,216,255,0.04);padding:0}
table.hm td.sa{color:#66ffaa;font-weight:700;text-align:center;padding:4px 6px}
table.hm td.sr{color:#ffaa44;font-weight:700;text-align:center;padding:4px 6px}
.rsep td{padding:0!important;border:none!important}
.rsep .rl{font-size:10px;color:#4dd8ff;font-weight:700;padding:10px 10px 4px;letter-spacing:2px;background:#111b2e}
.lc-h{font-size:8px;color:#3a4a58;display:block;margin-top:1px}

.loading{text-align:center;padding:60px 20px;color:#5a6a88;font-size:13px}

/* Wordpacks */
.wp-search-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.wp-card{background:#111b2e;border:1px solid rgba(77,216,255,0.06);border-radius:10px;padding:14px;margin-bottom:10px}
.wp-cat-name{font-size:15px;font-weight:700;color:#fff;margin-bottom:2px}
.wp-cat-meta{font-size:11px;color:#5a6a88;margin-bottom:8px}
.wp-words{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.wp-word{padding:3px 8px;background:rgba(77,216,255,0.08);border:1px solid rgba(77,216,255,0.12);border-radius:6px;font-size:11px;color:#8ab4d0}
.wp-word.match{background:rgba(255,170,68,0.15);border-color:rgba(255,170,68,0.3);color:#ffaa44;font-weight:600}
.wp-price-row{display:flex;align-items:center;gap:12px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.04)}
.wp-price{font-size:20px;font-weight:800;color:#4dd8ff}
.wp-price-label{font-size:11px;color:#5a6a88}
.wp-price-city{font-size:12px;color:#8a9ab0;font-weight:500}
.wp-dist{font-size:11px;color:#5a6a88;margin-left:auto}
.wp-products{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.wp-prod{padding:1px 5px;background:rgba(255,255,255,0.03);border-radius:4px;font-size:9px;color:#3a4a58}
</style></head><body>

<div class="hdr">
  <h1>商机 <em>筛选助手</em></h1>
  <div class="sub">门店商机 + 抢占地图 + 词包价格查询</div>
</div>

<div class="main-tabs">
  <button class="main-tab active" onclick="switchTab('stores',this)">门店商机</button>
  <button class="main-tab" onclick="switchTab('heatmap',this)">抢占地图</button>
  <button class="main-tab" onclick="switchTab('wordpacks',this)">词包价格</button>
</div>

<!-- Stores tab -->
<div id="tabStores" class="tab-content active">
  <div class="kpi-row" id="kpiRow"><div class="loading">加载中...</div></div>
  <div class="filter-row" id="filterRow"></div>
  <div class="sort-row" id="sortRow"></div>
  <div class="count-bar" id="countBar"></div>
  <div id="storeList"></div>
</div>

<!-- Heatmap tab -->
<div id="tabHeatmap" class="tab-content">
  <div class="hm-legend">
    <span><i style="background:rgba(102,255,170,0.08)"></i>空白可抢</span>
    <span><i style="background:rgba(102,255,170,0.15)"></i>已释放</span>
    <span><i style="background:rgba(255,170,68,0.25)"></i>30天内</span>
    <span><i style="background:rgba(255,107,107,0.15)"></i>30-90天</span>
    <span><i style="background:rgba(255,80,80,0.06)"></i>90天+</span>
  </div>
  <div class="hm-rtabs" id="hmRTabs"></div>
  <div class="kpi-row" id="hmKpis"></div>
  <div class="hm-wrap" id="hmWrap"><div class="loading">点击"抢占地图"加载数据...</div></div>
</div>

<!-- Wordpacks tab -->
<div id="tabWordpacks" class="tab-content">
  <div class="wp-search-row">
    <input class="search-input" id="wpSearch" placeholder="搜索类目或关键词（如：火锅、烧烤、粤菜）..." oninput="renderWP()">
    <input class="filter-sel" id="wpLocation" placeholder="输入城市或区（如：北京、朝阳区）" list="wpLocList" oninput="onWPLocationInput()" style="min-width:200px">
    <datalist id="wpLocList"></datalist>
  </div>
  <div class="count-bar" id="wpCount"></div>
  <div id="wpList"><div class="loading">点击"词包价格"加载数据...</div></div>
</div>

<script>
var ALL_STORES=null,HM=null,HM_R='all';
var F={prov:'',city:'',cat:'',l1:'',q:''},SORT='score';

// Load stores
fetch('data/all_stores.json').then(r=>r.json()).then(d=>{ALL_STORES=d;init()}).catch(e=>{document.getElementById('storeList').innerHTML='<div class="empty-msg">数据加载失败</div>'});

function init(){
  renderKPIs();renderFilters();renderSort();renderStores();
}

function switchTab(tab,el){
  document.querySelectorAll('.main-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tabStores').classList.toggle('active',tab==='stores');
  document.getElementById('tabHeatmap').classList.toggle('active',tab==='heatmap');
  document.getElementById('tabWordpacks').classList.toggle('active',tab==='wordpacks');
  if(tab==='heatmap'&&!HM){
    document.getElementById('hmWrap').innerHTML='<div class="loading">加载中...</div>';
    fetch('data/heatmap.json').then(r=>r.json()).then(d=>{HM=d;renderHM()}).catch(e=>console.error(e));
  }
  if(tab==='wordpacks'&&!WP){
    document.getElementById('wpList').innerHTML='<div class="loading">加载中...</div>';
    fetch('data/wordpacks.json?v=3').then(r=>r.json()).then(d=>{WP=d;initWP()}).catch(e=>console.error(e));
  }
}

// === Stores ===
function filtered(){
  var list=ALL_STORES||[];
  if(F.prov)list=list.filter(s=>s.prov===F.prov);
  if(F.city)list=list.filter(s=>s.c===F.city);
  if(F.cat)list=list.filter(s=>s.cat===F.cat);
  if(F.l1)list=list.filter(s=>s.l===F.l1);
  if(F.q){var q=F.q.toLowerCase();list=list.filter(s=>(s.n||'').toLowerCase().includes(q)||(s.prov||'').toLowerCase().includes(q))}
  if(SORT==='score')list.sort((a,b)=>(b.s||0)-(a.s||0));
  else if(SORT==='gmv')list.sort((a,b)=>(b.g||0)-(a.g||0));
  else if(SORT==='ad')list.sort((a,b)=>(b.ad||0)-(a.ad||0));
  else list.sort((a,b)=>(a.n||'').localeCompare(b.n||''));
  return list;
}
function renderKPIs(){
  var list=ALL_STORES||[];
  var t=list.length,p0=list.filter(s=>s.s>=40).length,p1=list.filter(s=>s.s>=25&&s.s<40).length;
  var tb=list.filter(s=>s.l==='交易大户').length,adv=list.filter(s=>s.l==='广告在投').length;
  var hp=list.filter(s=>s.l==='高潜未投').length;
  document.getElementById('kpiRow').innerHTML=
    '<div class="kpi-card"><div class="kpi-v">'+t+'</div><div class="kpi-l">活跃门店</div></div>'+
    '<div class="kpi-card red"><div class="kpi-v">'+p0+'</div><div class="kpi-l">P0优先</div></div>'+
    '<div class="kpi-card orange"><div class="kpi-v">'+p1+'</div><div class="kpi-l">P1重点</div></div>'+
    '<div class="kpi-card green"><div class="kpi-v">'+tb+'</div><div class="kpi-l">交易大户</div></div>'+
    '<div class="kpi-card"><div class="kpi-v">'+adv+'</div><div class="kpi-l">广告在投</div></div>'+
    '<div class="kpi-card green"><div class="kpi-v">'+hp+'</div><div class="kpi-l">高潜未投</div></div>';
}
function renderFilters(){
  var list=ALL_STORES||[];
  var provs=[...new Set(list.map(s=>s.prov))].sort();
  var cities=[...new Set(list.map(s=>s.c))].sort();
  var cats=[...new Set(list.map(s=>s.cat))].sort();
  var l1s=['交易大户','广告在投','高潜未投','潜力成长','待激活'];
  var h='<select class="filter-sel" onchange="F.prov=this.value;renderStores()" style="min-width:120px"><option value="">全部服务商</option>';
  provs.forEach(p=>{h+='<option>'+esc(p)+'</option>'});
  h+='</select><select class="filter-sel" onchange="F.city=this.value;renderStores()"><option value="">全部城市</option>';
  cities.forEach(c=>{h+='<option>'+c+'</option>'});
  h+='</select><select class="filter-sel" onchange="F.cat=this.value;renderStores()"><option value="">全部类目</option>';
  cats.forEach(c=>{h+='<option>'+c+'</option>'});
  h+='</select><select class="filter-sel" onchange="F.l1=this.value;renderStores()"><option value="">全部标签</option>';
  l1s.forEach(l=>{h+='<option>'+l+'</option>'});
  h+='</select><input class="search-input" placeholder="搜索门店/服务商..." oninput="F.q=this.value;renderStores()">';
  document.getElementById('filterRow').innerHTML=h;
}
function renderSort(){
  document.getElementById('sortRow').innerHTML=
    '<button class="sort-btn active" onclick="setSort(this,\'score\')">按评分</button>'+
    '<button class="sort-btn" onclick="setSort(this,\'gmv\')">按GMV</button>'+
    '<button class="sort-btn" onclick="setSort(this,\'ad\')">按广告</button>'+
    '<button class="sort-btn" onclick="setSort(this,\'name\')">按名称</button>';
}
function setSort(el,m){SORT=m;document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderStores()}
function renderStores(){
  var list=filtered();
  document.getElementById('countBar').textContent='共 '+list.length+' 家门店';
  if(!list.length){document.getElementById('storeList').innerHTML='<div class="empty-msg">无匹配门店</div>';return}
  var show=list.slice(0,200),h='';
  show.forEach(s=>{
    var pc=s.s>=40?'p0':(s.s>=25?'p1':''),sc=s.s>=40?'p0':(s.s>=25?'p1':'p2');
    var tags='<span class="sc-tag tag-l1">'+s.l+'</span>';
    if(s.l==='交易大户')tags+='<span class="sc-tag tag-trade">高GMV未投</span>';
    else if(s.l==='广告在投')tags+='<span class="sc-tag tag-adv">可追售</span>';
    else if(s.l==='高潜未投')tags+='<span class="sc-tag tag-potential">优先攻坚</span>';
    var nums='';
    if(s.g)nums+='<span>GMV <span class="nv">'+fmtN(s.g)+'</span></span>';
    if(s.ad)nums+='<span>广告 <span class="nv">'+fmtN(s.ad)+'</span></span>';
    if(s.ca)nums+='<span>现金 <span class="nv">'+fmtN(s.ca)+'</span></span>';
    if(!nums)nums='<span style="color:#3a4a58">无经营数据</span>';
    h+='<div class="store-card '+pc+'"><div class="sc-top"><span class="sc-name">'+esc(s.n)+'</span><span class="sc-score '+sc+'">'+s.s+'分</span></div>'+
      '<div class="sc-meta"><span>'+s.c+'</span><span>'+s.cat+'</span><span style="color:#3a4a68">'+esc(s.prov||'')+'</span></div><div class="sc-tags">'+tags+'</div><div class="sc-nums">'+nums+'</div></div>';
  });
  if(list.length>200)h+='<div class="empty-msg">显示前200条，请用筛选缩小范围</div>';
  document.getElementById('storeList').innerHTML=h;
}
function fmtN(n){if(n>=10000)return(n/10000).toFixed(1)+'万';if(n>=1000)return(n/1000).toFixed(1)+'K';return String(Math.round(n))}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// === Heatmap ===
// Category mapping: heatmap group → store category filter value
var CAT_MAP={'中餐':'中餐','火锅':'火锅','烧烤':'烧烤','小吃快餐':'快餐小吃',
  '水产海鲜':'生鲜','饮品':'休闲茶饮','日本料理':'日韩料理','自助餐':'自助餐',
  '糕点-烘焙':'烘焙糕点','西餐':'西餐','东南亚菜':'东南亚菜','熟食':'快餐小吃'};

function jumpToStores(cityName, catGroup){
  // Switch to stores tab
  document.querySelectorAll('.main-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.main-tab')[0].classList.add('active');
  document.getElementById('tabStores').classList.add('active');
  document.getElementById('tabHeatmap').classList.remove('active');
  // Set filters
  F.city=cityName;
  F.cat=CAT_MAP[catGroup]||catGroup;
  F.prov='';F.l1='';F.q='';
  // Re-render filters to show selection
  renderFilters();
  renderStores();
  // Scroll to top
  window.scrollTo(0,0);
}
function renderHM(){
  if(!HM)return;
  var rh='<button class="hm-rtab '+(HM_R==='all'?'active':'')+'" onclick="setHMR(\'all\')">全部 '+HM.cities.length+'城</button>';
  HM.regions.forEach(r=>{
    var cnt=HM.cities.filter(c=>c.region===r).length;
    rh+='<button class="hm-rtab '+(HM_R===r?'active':'')+'" onclick="setHMR(\''+r+'\')">'+r+' '+cnt+'</button>';
  });
  document.getElementById('hmRTabs').innerHTML=rh;
  
  var cities=HM_R==='all'?HM.cities:HM.cities.filter(c=>c.region===HM_R);
  var cats=HM.cats;
  var tA=0,tR=0;
  cities.forEach(c=>{tA+=c.avail;tR+=c.rel30});
  document.getElementById('hmKpis').innerHTML=
    '<div class="kpi-card"><div class="kpi-v">'+cities.length+'</div><div class="kpi-l">城市</div></div>'+
    '<div class="kpi-card green"><div class="kpi-v">'+tA+'</div><div class="kpi-l">空白槽位</div></div>'+
    '<div class="kpi-card orange"><div class="kpi-v">'+tR+'</div><div class="kpi-l">30天内释放</div></div>'+
    '<div class="kpi-card"><div class="kpi-v">'+cats.length+'</div><div class="kpi-l">核心类目</div></div>';
  
  var gb=[];var lg='';
  cats.forEach((c,i)=>{if(c.group!==lg&&lg!=='')gb.push(i);lg=c.group});
  var nc=cats.length+3+gb.length;
  
  var h='<table class="hm"><thead><tr><th class="hc">城市</th>';
  cats.forEach((c,i)=>{if(gb.includes(i))h+='<th class="gs"></th>';h+='<th title="'+c.label+'">'+c.label+'</th>'});
  h+='<th style="color:#66ffaa">可抢</th><th style="color:#ffaa44">30天</th></tr></thead><tbody>';
  
  var lr='';
  cities.forEach(city=>{
    if(city.region!==lr){h+='<tr class="rsep"><td class="rl" colspan="'+nc+'">▎'+city.region+'</td></tr>';lr=city.region}
    var cl=city.city;if(city.lc)cl+='<span class="lc-h">'+city.lc+'</span>';
    h+='<tr><td class="cc">'+cl+'</td>';
    cats.forEach((cat,i)=>{
      if(gb.includes(i))h+='<td class="gs"></td>';
      var occ=city.occ[cat.id];
      if(!occ)h+='<td class="av" onclick="jumpToStores(\''+city.city.replace(/'/g,"\\'")+'\',\''+cat.group+'\')" title="点击查看'+city.city+'·'+cat.label+'的门店商机" style="cursor:pointer;color:#66ffaa44">+</td>';
      else if(occ.d<0)h+='<td class="fr" onclick="jumpToStores(\''+city.city.replace(/'/g,"\\'")+'\',\''+cat.group+'\')" title="已释放，点击查看门店" style="cursor:pointer">✓</td>';
      else if(occ.d<=30)h+='<td class="so" onclick="jumpToStores(\''+city.city.replace(/'/g,"\\'")+'\',\''+cat.group+'\')" title="'+occ.ds+'释放，先看现有门店" style="cursor:pointer">'+occ.ds+'</td>';
      else if(occ.d<=90)h+='<td class="md" title="'+occ.ds+'">'+occ.ds+'</td>';
      else h+='<td class="fa" title="'+occ.ds+'">'+occ.ds+'</td>';
    });
    h+='<td class="sa">'+city.avail+'</td><td class="sr">'+(city.rel30>0?city.rel30:'-')+'</td></tr>';
  });
  h+='</tbody></table>';
  document.getElementById('hmWrap').innerHTML=h;
}
function setHMR(r){HM_R=r;renderHM()}

// === Wordpacks ===
var WP=null, WP_LOC={}, WP_CITY='', WP_DIST='';
function initWP(){
  if(!WP)return;
  // Build location lookup: city→{type:'city'}, district→{type:'district', city:X}
  WP_LOC={};
  var datalist=document.getElementById('wpLocList');
  var options='';
  WP.cities.forEach(c=>{
    if(!WP_LOC[c])WP_LOC[c]={type:'city',city:c};
    options+='<option value="'+esc(c)+'">';
  });
  // Add districts
  WP.cats.forEach(cat=>{
    if(!cat.districts)return;
    Object.keys(cat.districts).forEach(city=>{
      Object.keys(cat.districts[city]).forEach(d=>{
        if(!WP_LOC[d])WP_LOC[d]={type:'district',city:city};
        options+='<option value="'+esc(d)+'">';
      });
    });
  });
  datalist.innerHTML=options;
  renderWP();
}
function onWPLocationInput(){
  var val=(document.getElementById('wpLocation').value||'').trim();
  WP_CITY='';WP_DIST='';
  if(val&&WP_LOC[val]){
    var loc=WP_LOC[val];
    if(loc.type==='city'){WP_CITY=loc.city}
    else{WP_CITY=loc.city;WP_DIST=val}
  }else if(val){
    // Fuzzy match: find city containing the input
    var found=WP.cities.find(c=>c.includes(val));
    if(found)WP_CITY=found;
  }
  renderWP();
}
function renderWP(){
  if(!WP)return;
  var q=(document.getElementById('wpSearch').value||'').toLowerCase().trim();
  var city=WP_CITY, district=WP_DIST;
  
  var list=WP.cats.slice();
  if(q){
    list=list.filter(c=>{
      if(c.short.toLowerCase().includes(q))return true;
      if(c.cat.toLowerCase().includes(q))return true;
      return c.words.some(w=>w.toLowerCase().includes(q));
    });
  }
  if(q){
    list.sort((a,b)=>{
      var aM=a.words.some(w=>w.toLowerCase().includes(q))?0:1;
      var bM=b.words.some(w=>w.toLowerCase().includes(q))?0:1;
      return aM-bM||a.short.localeCompare(b.short);
    });
  }
  
  document.getElementById('wpCount').textContent='共 '+list.length+' 个类目'+(city?' · '+city+(district?' '+district:''):'');
  if(!list.length){document.getElementById('wpList').innerHTML='<div class="empty-msg">无匹配类目</div>';return}
  
  var show=list.slice(0,50),h='';
  show.forEach(c=>{
    var price=null,priceLabel='';
    if(city&&district&&c.districts&&c.districts[city]&&c.districts[city][district]!==undefined){
      price=c.districts[city][district];
      priceLabel=city+' · '+district;
    }else if(city&&c.prices[city]!==undefined){
      price=c.prices[city];
      priceLabel=city+(district?' (无该区定价，显示全市均价)':'');
    }else if(city&&c.districts&&c.districts[city]){
      var dPrices=Object.values(c.districts[city]);
      if(dPrices.length){
        var mn=Math.min(...dPrices),mx=Math.max(...dPrices);
        priceLabel=city+' '+dPrices.length+'个区';
        price=null;
        var priceRange=mn===mx?'¥'+mn.toLocaleString():'¥'+mn.toLocaleString()+' ~ ¥'+mx.toLocaleString();
      }
    }
    var priceRange2='';
    if(!city){
      var allP=Object.values(c.prices);
      if(c.districts){Object.values(c.districts).forEach(dp=>{allP=allP.concat(Object.values(dp))})}
      if(allP.length){
        var mn=Math.min(...allP),mx=Math.max(...allP);
        priceRange2=mn===mx?'¥'+mn.toLocaleString():'¥'+mn.toLocaleString()+' ~ ¥'+mx.toLocaleString();
      }
    }
    
    var wordHtml=c.words.map(w=>{
      var isMatch=q&&w.toLowerCase().includes(q);
      return '<span class="wp-word'+(isMatch?' match':'')+'">'+esc(w)+'</span>';
    }).join('');
    if(!c.words||c.words.length===0)wordHtml='<span style="color:#3a4a58;font-size:11px">无词包</span>';
    
    var prodHtml='';
    if(c.prod&&c.prod.length&&c.prod[0]){
      prodHtml='<div class="wp-products">';
      c.prod.forEach(p=>{prodHtml+='<span class="wp-prod">'+p.replace('ADVERT_','')+'</span>'});
      prodHtml+='</div>';
    }
    
    h+='<div class="wp-card">';
    h+='<div class="wp-cat-name">'+esc(c.short)+'</div>';
    h+='<div class="wp-cat-meta">'+esc(c.cat)+' · '+c.wc+'个关键词'+(c.dist?' · 置顶'+c.dist+'km':'')+'</div>';
    h+='<div class="wp-words">'+wordHtml+'</div>';
    h+='<div class="wp-price-row">';
    if(price!==null&&price!==undefined){
      h+='<span class="wp-price">¥'+price.toLocaleString()+'</span>';
      h+='<span class="wp-price-city">'+esc(priceLabel)+'</span>';
    }else if(city&&priceLabel&&priceRange){
      h+='<span class="wp-price">'+priceRange+'</span>';
      h+='<span class="wp-price-city">'+esc(priceLabel)+'</span>';
    }else if(priceRange2){
      h+='<span class="wp-price">'+priceRange2+'</span>';
      h+='<span class="wp-price-label">全城市价格区间</span>';
    }else{
      h+='<span class="wp-price" style="color:#5a6a88">暂无报价</span>';
    }
    if(c.dist)h+='<span class="wp-dist">最大置顶 '+c.dist+'km</span>';
    h+='</div>';
    h+=prodHtml;
    h+='</div>';
  });
  
  if(list.length>50)h+='<div class="empty-msg">显示前50个，请搜索缩小范围</div>';
  document.getElementById('wpList').innerHTML=h;
}
</script>
